{% extends 'base.html' %}
{% block main %}
<div class="h-full flex flex-col bg-white">
  <div
    class="absolute top-0 left-0 right-0 z-20 px-3 py-3 bg-white border-b border-neutral-100 flex items-center gap-3">
    <a href="{% url 'chat-details' chat.id %}"
      class="size-8 flex items-center justify-center rounded-full hover:bg-neutral-100">
      <i class="fa-solid fa-chevron-left text-black"></i>
    </a>
    <h1 class="page-title">Chat Settings</h1>
  </div>

  <main class="mt-[64px] px-3 pb-8 overflow-y-auto">
    <div class="flex flex-col items-center pt-4 pb-5">
      {% include 'components/avatar.html' with user=friend size='lg' ring='yes' %}
      <p class="item-title mt-3">{{ friend.username }}</p>
      <p class="item-meta mt-0.5">Message settings</p>
    </div>

    <form action="{% url 'chat-settings' chat.id %}" method="post">
      {% csrf_token %}

      <p class="field-label px-2 mb-2">Delete messages</p>

      <div class="rounded-2xl bg-neutral-50 overflow-hidden">
        <label class="flex items-start gap-3 px-3 py-3.5 cursor-pointer border-b border-neutral-100">
          <input type="radio" name="mode" value="keep"
            class="radio radio-sm mt-0.5 checked:bg-[#FFFC00] checked:text-black"
            {% if chat.mode == "keep" %}checked{% endif %}>
          <div class="min-w-0">
            <p class="item-title">Keep Forever</p>
            <p class="item-meta mt-0.5">Messages stay in the chat</p>
          </div>
        </label>

        <label class="flex items-start gap-3 px-3 py-3.5 cursor-pointer border-b border-neutral-100">
          <input type="radio" name="mode" value="on_close"
            class="radio radio-sm mt-0.5 checked:bg-[#FFFC00] checked:text-black"
            {% if chat.mode == "on_close" %}checked{% endif %}>
          <div class="min-w-0">
            <p class="item-title">Delete After Viewing</p>
            <p class="item-meta mt-0.5">Received messages delete when you open the chat</p>
          </div>
        </label>

        <label class="flex items-start gap-3 px-3 py-3.5 cursor-pointer">
          <input type="radio" name="mode" value="after_24_hr"
            class="radio radio-sm mt-0.5 checked:bg-[#FFFC00] checked:text-black"
            {% if chat.mode == "after_24_hr" %}checked{% endif %}>
          <div class="min-w-0">
            <p class="item-title">Delete After 24 Hours</p>
            <p class="item-meta mt-0.5">Only show messages from the last 24 hours</p>
          </div>
        </label>
      </div>

      <button type="submit"
        class="btn w-full mt-6 rounded-full border-0 bg-[#FFFC00] hover:bg-[#F5F000] text-black font-bold h-11">
        Save Settings
      </button>
    </form>
  </main>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light" class="h-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat</title>
    <script>
        (function() {
            const theme = localStorage.getItem("theme") || "light";
            if (theme === "dark") {
                document.documentElement.classList.add("dark-theme");
                document.documentElement.setAttribute("data-theme", "dark");
            } else {
                document.documentElement.classList.remove("dark-theme");
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/06fd46cb4b.js" crossorigin="anonymous"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Public Sans", system-ui, sans-serif;
        }

        html {
            @apply font-sans text-sm text-black antialiased;
        }

        .page-title {
            @apply text-base font-semibold text-black;
        }

        .item-title {
            @apply text-sm font-semibold text-black;
        }

        .item-meta {
            @apply text-xs text-neutral-400;
        }

        .field-label {
            @apply text-xs font-medium text-neutral-500;
        }

        .body-text {
            @apply text-sm text-neutral-500;
        }
    </style>
    <style>
        /* Global CSS Variables for Theme overrides */
        :root {
          --bg-color: #ffffff;
          --text-color: #1c1c1c;
          --card-bg: #f4f4f5;
          --border-color: #e4e4e7;
        }
        
        .dark-theme {
          --bg-color: #0c0c0c;
          --text-color: #f4f4f5;
          --card-bg: #18181b;
          --border-color: #27272a;
        }
        
        /* Apply variables dynamically to general layout classes when dark theme is enabled */
        .dark-theme body,
        .dark-theme .bg-white,
        .dark-theme .bg-neutral-50,
        .dark-theme .bg-neutral-100 {
          background-color: var(--bg-color) !important;
          color: var(--text-color) !important;
        }
        .dark-theme .text-black,
        .dark-theme .text-neutral-900,
        .dark-theme .text-neutral-700,
        .dark-theme .text-neutral-500,
        .dark-theme .page-title,
        .dark-theme .item-title,
        .dark-theme .body-text {
          color: var(--text-color) !important;
        }
        .dark-theme .border-neutral-100,
        .dark-theme .border-neutral-200 {
          border-color: var(--border-color) !important;
        }
        .dark-theme .bg-neutral-50,
        .dark-theme .bg-neutral-100 {
          background-color: var(--card-bg) !important;
        }
        .dark-theme input {
          background-color: var(--card-bg) !important;
          color: var(--text-color) !important;
          border-color: var(--border-color) !important;
        }
        .dark-theme .bg-white\/95,
        .dark-theme .bg-white\/90,
        .dark-theme .bg-white\/80 {
          background-color: rgba(12, 12, 12, 0.95) !important;
          color: var(--text-color) !important;
        }
        .dark-theme .dock,
        .dark-theme nav.dock {
          background-color: #0c0c0c !important;
          border-color: #27272a !important;
          color: #a1a1aa !important;
        }
        .dark-theme .dock a {
          color: #a1a1aa !important;
        }
        .dark-theme .dock-active,
        .dark-theme .dock a.dock-active {
          color: #ffffff !important;
        }
        .dark-theme .dock-active i {
          color: #ffffff !important;
        }
        .dark-theme .hover\:bg-neutral-50:hover,
        .dark-theme .hover\:bg-neutral-100:hover,
        .dark-theme .hover\:bg-neutral-200:hover {
          background-color: #1e1e1f !important;
        }

        /* Profile page theme adjustments when in LIGHT mode (i.e. default, NOT .dark-theme) */
        html:not(.dark-theme) .bg-\[\#0c0c0c\],
        html:not(.dark-theme) .bg-neutral-950,
        html:not(.dark-theme) .bg-neutral-900 {
          background-color: #ffffff !important;
          color: #1c1c1c !important;
        }
        html:not(.dark-theme) .text-white,
        html:not(.dark-theme) .text-neutral-300,
        html:not(.dark-theme) .text-neutral-400 {
          color: #1c1c1c !important;
        }
        html:not(.dark-theme) .profile-header-bg {
          background: linear-gradient(to bottom, #dbeafe, #f3f4f6) !important;
        }
        html:not(.dark-theme) .border-white\/10,
        html:not(.dark-theme) .border-neutral-800,
        html:not(.dark-theme) .border-neutral-900 {
          border-color: #e5e7eb !important;
        }
        html:not(.dark-theme) .bg-neutral-900,
        html:not(.dark-theme) .bg-neutral-800,
        html:not(.dark-theme) .bg-black\/45 {
          background-color: #f3f4f6 !important;
        }
        html:not(.dark-theme) .hover\:bg-neutral-800\/50:hover,
        html:not(.dark-theme) .hover\:bg-neutral-800:hover {
          background-color: #e5e7eb !important;
        }
        html:not(.dark-theme) .divide-neutral-800 > :not([hidden]) ~ :not([hidden]) {
          border-color: #e5e7eb !important;
        }
        html:not(.dark-theme) .btn-neutral-900 {
          background-color: #f3f4f6 !important;
          color: #1c1c1c !important;
        }
        html:not(.dark-theme) .modal-box {
          background-color: #ffffff !important;
          color: #1c1c1c !important;
        }
        html:not(.dark-theme) .file-input,
        html:not(.dark-theme) .input {
          background-color: #f3f4f6 !important;
          color: #1c1c1c !important;
          border-color: #e5e7eb !important;
        }
        html:not(.dark-theme) .text-neutral-500,
        html:not(.dark-theme) .text-neutral-600 {
          color: #64748b !important;
        }
    </style>
</head>

<body class="h-full overflow-hidden font-sans">
    <div class="h-dvh overflow-hidden bg-white sm:bg-neutral-950 flex justify-center items-center sm:p-6">
        <div
            class="relative w-full h-full overflow-hidden bg-white sm:w-auto sm:h-[min(812px,calc(100dvh-3rem))] sm:aspect-[390/845] sm:border-[6px] sm:border-neutral-800 sm:rounded-[1.75rem]">
            <div class="relative w-full h-full overflow-hidden sm:rounded-[1.35rem]">
                {% block main %}
                {% endblock %}
            </div>
        </div>
    </div>
    {% if request.user.is_authenticated %}
    <script>
        (function() {
            function syncLocation() {
                if (!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        fetch("{% url 'update-location' %}", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "X-CSRFToken": "{{ csrf_token }}"
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lng
                            })
                        }).catch(err => console.error("Error updating location:", err));
                    },
                    (err) => console.warn("Geolocation warning:", err),
                    { enableHighAccuracy: true }
                );
            }
            syncLocation();
            setInterval(syncLocation, 60000);
        })();
    </script>
    {% endif %}
</body>
<script src="{% static 'index.js' %}"></script>

</html>
